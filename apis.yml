name: Proximie
description: 'Proximie is a health-tech company building a cloud platform it describes as the operating
  system for intelligent operating rooms, connecting surgical teams, medical devices, and data for remote
  telementoring, telesurgery, session recording, and AI-powered surgical insights across 500+ facilities
  in 50 countries. For developers, Proximie ships a pre-release C++ SDK (media streaming and session
  management, with an internal REST layer) and runs a Development Partners program that lets OEMs and
  medtech companies embed real-time connectivity, secure data routing, and white-label collaboration
  into their own devices. Proximie also open-sources WebRTC/Janus tooling (jarust, janus-mobile-sdk).
  Backed by SoftBank Vision Fund.'
